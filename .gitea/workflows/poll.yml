name: poll

on:
  schedule:
    # seats.aero Pro tier = 1000 calls/calendar day, resets midnight UTC.
    # One cycle = ~72 search calls (windows × routes × directions), so the daily
    # budget caps us at ~13 cycles/day across all matrix entries combined. Every 2
    # hours = 12 cycles/day per region, leaving headroom for /trips enrichment.
    - cron: "0 */2 * * *"
  workflow_dispatch:

env:
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  S3_PREFIX: ${{ vars.S3_PREFIX || 'award-flight-researcher' }}

jobs:
  poll:
    runs-on: ubuntu-latest
    # One job loops over every region in POLL_MATRIX. We can't use a dynamic
    # strategy.matrix here: Gitea (even 1.26.2 + act_runner 0.6.x) freezes the
    # matrix at plan time before any source is available — `vars` isn't injected
    # into strategy.matrix at all, and a `needs.<job>.outputs` value isn't ready
    # yet — so `fromJSON(...)` collapses to a single empty job (#25179). Looping
    # in one job keeps the region list in the POLL_MATRIX variable (uncommitted)
    # and runs regions sequentially.
    concurrency:
      group: poll
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install mc + jq
        run: |
          set -e
          curl -sSLo /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /usr/local/bin/mc
          command -v jq >/dev/null || { apt-get update -qq && apt-get install -y -qq jq; }
          mc alias set homelab "$S3_ENDPOINT" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
          mc ls "homelab/$S3_BUCKET/$S3_PREFIX/"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: uv sync
        run: ~/.local/bin/uv sync

      - name: Poll all regions
        run: |
          fail=0
          # Process substitution (not a pipe) so `fail` survives the loop body.
          while read -r region; do
            name=$(jq -r '.name'   <<<"$region")
            search=$(jq -r '.search // ""' <<<"$region")
            db=$(jq -r '.db'       <<<"$region")
            echo "::group::region=$name search=${search:-search.yaml} db=$db"
            db_path="data/$db"
            mkdir -p "$(dirname "$db_path")"
            if (
              set -e
              mc cp "homelab/$S3_BUCKET/$S3_PREFIX/${search:-search.yaml}" config/search.yaml
              mc cp "homelab/$S3_BUCKET/$S3_PREFIX/balances.yaml"          config/balances.yaml
              mc cp "homelab/$S3_BUCKET/$S3_PREFIX/$db" "$db_path" \
                || echo "no existing DB in MinIO — starting fresh"
              RESEARCHER_DB_PATH="$db_path" ~/.local/bin/uv run researcher init-db
              RESEARCHER_DB_PATH="$db_path" ~/.local/bin/uv run researcher run-once
              mc cp "$db_path" "homelab/$S3_BUCKET/$S3_PREFIX/$db"
            ); then
              echo "region=$name OK"
            else
              echo "region=$name FAILED (exit $?)"
              fail=1
            fi
            echo "::endgroup::"
          done < <(echo "$POLL_MATRIX" | jq -c '.[]')
          exit $fail
        env:
          POLL_MATRIX: ${{ vars.POLL_MATRIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SEATSAERO_API_KEY: ${{ secrets.SEATSAERO_API_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
